name: nexora

# Local development stack. Everything binds to 127.0.0.1 so databases are never
# exposed to your LAN. Override host ports with POSTGRES_PORT / REDIS_PORT /
# KAFKA_PORT / API_PORT / WEB_PORT if something else already uses them.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka-API broker for domain events. One small node: about 600 MB of RAM.
  redpanda:
    image: redpandadata/redpanda:v26.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=600M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./apps/api
      target: dev
    environment: &api-environment
      NEXORA_ENV: local
      NEXORA_DATABASE_URL: postgresql+asyncpg://nexora:nexora@postgres:5432/nexora
      NEXORA_REDIS_URL: redis://redis:6379/0
      NEXORA_KAFKA_BOOTSTRAP: redpanda:9092
      NEXORA_TEST_DATABASE_URL: postgresql+asyncpg://nexora:nexora@postgres:5432/nexora_test
      NEXORA_TEST_REDIS_URL: redis://redis:6379/15
      NEXORA_TEST_KAFKA_BOOTSTRAP: redpanda:9092
      # Optional GitHub sign-in (apps/api/README.md). Unset = the button stays hidden.
      NEXORA_GITHUB_CLIENT_ID: ${NEXORA_GITHUB_CLIENT_ID:-}
      NEXORA_GITHUB_CLIENT_SECRET: ${NEXORA_GITHUB_CLIENT_SECRET:-}
      # Docker Desktop on Windows/macOS does not forward file events into
      # containers, so the reloader polls instead.
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn --factory nexora.main:create_app --host 0.0.0.0 --port 8000
             --reload --reload-dir src --no-access-log"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Outbox relay + Kafka consumers (timeline fan-out, notifications). Without it the
  # API still works: home timelines notice the missing heartbeat and read straight
  # from Postgres.
  worker:
    build:
      context: ./apps/api
      target: dev
    environment: *api-environment
    command: python -m nexora.worker
    volumes:
      - ./apps/api:/app
    depends_on:
      api:
        condition: service_healthy # migrations have run
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # Production build of the web app. For day-to-day frontend work run
  # `npm run dev` in apps/web instead (much faster than a bind mount).
  web:
    profiles: ["web"]
    build:
      context: ./apps/web
      args:
        API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  redpandadata:
